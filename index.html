<script>

  panel.querySelector('.hd button').onclick = () => panel.classList.toggle('min');
  const grid = panel.querySelector('.grid');
  let storm = null;
  const buttons = [
    ['💬 Yeni kişi yorum', () => { const p = newPerson(); send({ type: 'chat', user: p.user, nickname: p.nickname, text: 'katıl' }); }],
    ['❤️ 15 beğeni', () => { const p = anyPerson(); send({ type: 'like', user: p.user, nickname: p.nickname, count: 15 }); }],
    ['👥 10 kişi katılsın', () => { for (let i = 0; i < 10; i++) setTimeout(() => { const p = newPerson(); send({ type: 'chat', user: p.user, nickname: p.nickname, text: 'selam' }); }, i * 120); }],
    ['🌧️ Beğeni yağmuru aç/kapa', () => {
      if (storm) { clearInterval(storm); storm = null; return; }
      storm = setInterval(() => { const a = G.list.filter(r => !r.out); if (!a.length) return; for (let k = 0; k < 3; k++) { const r = pick(a.slice(0, Math.max(1, Math.ceil(a.length * 0.6)))); send({ type: 'like', user: r.key, nickname: r.raw, count: 3 + ((Math.random() * 6) | 0) }); } }, 300);
    }],
    ['🎁 Küçük hediye', () => { const p = anyPerson(); send({ type: 'gift', user: p.user, nickname: p.nickname, giftName: 'Gül', diamonds: 1, count: 1 }); }],
    ['🎁 Büyük hediye', () => { const p = anyPerson(); send({ type: 'gift', user: p.user, nickname: p.nickname, giftName: 'Aslan', diamonds: 300, count: 1 }); }],
    ['➕ Takip', () => { const p = anyPerson(); send({ type: 'follow', user: p.user, nickname: p.nickname }); }],
    ['👋 Yayına giriş', () => { const p = newPerson(); send({ type: 'member', user: p.user, nickname: p.nickname }); }],
    ['▶️ Yarışı başlat', () => { if (G.phase === 'lobby' && G.list.length) startRace(); }],
    ['❌ Şimdi eleme', () => { if (G.phase === 'race') eliminate(); }],
    ['🏁 Bitişe ışınla', () => { const l = leader(); if (l && G.phase === 'race') l.x = CONFIG.race.distance - 5; }],
    ['🔊 Ses aç/kapat', () => SFX.toggle()],
    ['🎙️ Spiker testi', () => SPEECH.say('Merhaba! Ben stadyumun spikeriyim. Ses düzgün geliyor mu?', 3)],
    ['🔄 Yeni yarış', () => newRace(), 'warn'],
    ['🗑 Skorbordu sil', () => { if (confirm('Skorbord silinsin mi?')) STORE.clear(); }, 'warn']
  ];
  for (const [label, fn, cls] of buttons) { const b = document.createElement('button'); b.textContent = label; b.onclick = fn; if (cls) b.className = cls; grid.appendChild(b); }
  const stats = panel.querySelector('.stats');
  setInterval(() => {
    const l = leader();
    stats.textContent = 'FPS: ' + fps + '   Aşama: ' + G.phase + '\n' +
      'Yarışçı: ' + active().length + '/' + G.list.length + '   Sırada: ' + G.next.size + '\n' +
      'Lider: ' + (l ? Math.round(l.x) + ' m' : '-') + '   Süre: ' + Math.round(G.phaseTime) + ' sn\n' +
      'Kuyruk: ' + queue.length + '   Parçacık: ' + G.particles.length + '\n' +
      'WebSocket: ' + wsStatus + '   Ses: ' + SFX.state + '\n' +
      'Spiker: ' + (SPEECH.speaking ? 'konuşuyor' : 'sessiz');
  }, 400);
})();
</script>
</body>
</html>
